services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: outreach
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: outreach
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U outreach"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    command: ["api"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://outreach:${POSTGRES_PASSWORD}@db:5432/outreach
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ./backend
    command: ["worker"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://outreach:${POSTGRES_PASSWORD}@db:5432/outreach
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build: ./backend
    command: ["beat"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://outreach:${POSTGRES_PASSWORD}@db:5432/outreach
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - worker

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
