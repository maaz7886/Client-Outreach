[project]
name = "college-outreach"
version = "0.1.0"
description = "AI-powered college outreach automation system (AIValytics)"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "structlog>=24.1",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "PyJWT>=2.8",
    "passlib[bcrypt]>=1.7",
    "bcrypt==4.0.1",
    "psycopg[binary]>=3.1",
]
workers = [
    "celery[redis]>=5.4",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "pypdf>=4.2",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "factory-boy>=3.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
